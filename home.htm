<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tender Management Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --active-accent: #2563eb;
      --active-tint: rgba(37, 99, 235, 0.1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .nav-wrapper {
      position: relative;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 3px 24px 0;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .nav-wrapper::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #2563eb 0%, #4f46e5 50%, #0891b2 100%);
    }

    .submenu {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .submenu::-webkit-scrollbar { display: none; }

    .submenu a {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 15px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      border-radius: 8px 8px 0 0;
      transition: color 180ms ease, background-color 180ms ease, transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }

    .submenu a:hover {
      color: var(--text);
      background: rgba(15, 23, 42, 0.04);
      transform: translateY(-1px);
    }

    .submenu a.active {
      color: var(--active-accent);
      font-weight: 600;
      background: var(--active-tint);
    }

    .tab-indicator {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      border-radius: 3px 3px 0 0;
      background: var(--active-accent);
      transition: transform 260ms cubic-bezier(0.16, 1, 0.3, 1), width 260ms cubic-bezier(0.16, 1, 0.3, 1), background-color 200ms ease;
      pointer-events: none;
    }

    .viewport {
      position: relative;
      flex: 1;
      min-height: 0;
      background: var(--bg);
    }

    #content-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 200ms cubic-bezier(0.16, 1, 0.3, 1), transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    #content-frame.loading {
      opacity: 0;
      transform: translateY(8px);
    }

    @media (prefers-reduced-motion: reduce) {
      .submenu a, .tab-indicator, #content-frame { transition: none !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <nav class="nav-wrapper" aria-label="Tender workflow navigation">
      <div class="submenu" id="submenu-tender">
        <a onclick="loadPage('nit')" data-page="nit" data-accent="#2563eb" data-tint="rgba(37, 99, 235, 0.09)">📝 Prepare NIT</a>
        <a onclick="loadPage('sale')" data-page="sale" data-accent="#059669" data-tint="rgba(5, 150, 105, 0.09)">💰 Sale of Tender Form</a>
        <a onclick="loadPage('bidacceptreject')" data-page="bidacceptreject" data-accent="#d97706" data-tint="rgba(217, 119, 6, 0.10)">📊 Vendor's Bid Entry</a>
        <a onclick="loadPage('workorder')" data-page="workorder" data-accent="#4f46e5" data-tint="rgba(79, 70, 229, 0.09)">📜 Issue Work Order</a>
        <a onclick="loadPage('bill')" data-page="bill" data-accent="#e11d48" data-tint="rgba(225, 29, 72, 0.09)">📊 Bill Payment &amp; Deduction</a>
        <a onclick="loadPage('security')" data-page="security" data-accent="#0891b2" data-tint="rgba(8, 145, 178, 0.09)">🔒 Security Money Return</a>
        <span class="tab-indicator" id="tab-indicator" aria-hidden="true"></span>
      </div>
    </nav>

    <main class="viewport">
      <iframe id="content-frame" title="Tender Stage Content" src="nit.html"></iframe>
    </main>
  </div>

  <script>
    const PAGE_MAP = {
      nit: 'nit.htm',
      sale: 'sale.htm',
      bidacceptreject: 'bidacceptreject.htm',
      workorder: 'workorder.htm',
      bill: 'bill.htm',
      security: 'security.htm'
    };

    const frame = document.getElementById('content-frame');
    const indicator = document.getElementById('tab-indicator');
    const links = Array.from(document.querySelectorAll('#submenu-tender a'));

    function moveIndicator(activeLink) {
      if (!activeLink) return;
      const accent = activeLink.dataset.accent || '#2563eb';
      const tint = activeLink.dataset.tint || 'rgba(37, 99, 235, 0.09)';
      document.documentElement.style.setProperty('--active-accent', accent);
      document.documentElement.style.setProperty('--active-tint', tint);
      indicator.style.width = activeLink.offsetWidth + 'px';
      indicator.style.transform = 'translateX(' + activeLink.offsetLeft + 'px)';
    }

    function setActiveTab(page) {
      let activeLink = null;
      links.forEach((link) => {
        const isMatch =
          link.dataset.page === page ||
          (link.getAttribute('onclick') || '').includes("'" + page + "'");
        link.classList.toggle('active', isMatch);
        link.setAttribute('aria-current', isMatch ? 'page' : 'false');
        if (isMatch) activeLink = link;
      });
      moveIndicator(activeLink);
    }

    function loadPage(page) {
      const targetFile = PAGE_MAP[page] || page + '.html';
      setActiveTab(page);

      if (window.location.hash !== '#' + page) {
        history.replaceState(null, '', '#' + page);
      }

      frame.classList.add('loading');
      frame.src = targetFile;
    }

    frame.addEventListener('load', () => {
      requestAnimationFrame(() => frame.classList.remove('loading'));
    });

    window.addEventListener('resize', () => {
      const current = document.querySelector('#submenu-tender a.active');
      if (current) moveIndicator(current);
    });

    window.addEventListener('hashchange', () => {
      const hashPage = window.location.hash.replace('#', '');
      if (PAGE_MAP[hashPage]) {
        loadPage(hashPage);
      }
    });

    const initialPage = window.location.hash.replace('#', '');
    loadPage(PAGE_MAP[initialPage] ? initialPage : 'nit');
  </script>
</body>
</html>
